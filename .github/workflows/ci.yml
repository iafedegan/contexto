name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Valores dummy para que el build (SSG) no falle por falta de entorno.
          NEXT_PUBLIC_SITE_URL: https://www.contextoganadero.com
          NEXT_PUBLIC_SITE_NAME: CONtexto Ganadero
          AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
